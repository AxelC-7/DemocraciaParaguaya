<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Democracia Paraguaya - Noticias</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen"><div id="root"></div>
<script type="text/babel">
function App() {
 const [consulta,setConsulta]=React.useState("Jorge Schreiner Paraguay");
 const [limite,setLimite]=React.useState(5);
 const [noticias,setNoticias]=React.useState([]);
 const [cargando,setCargando]=React.useState(false);
 const [error,setError]=React.useState("");
 const [mensaje,setMensaje]=React.useState("");
 async function buscar(e) {
  e.preventDefault(); setCargando(true); setError(""); setMensaje(""); setNoticias([]);
  try {
   const r=await fetch("/api/recoleccion/noticias",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({consulta,limite:Number(limite)})});
   const d=await r.json(); if(!r.ok) throw new Error(d.error||"Falló la recolección.");
   setNoticias(d.noticias||[]); setMensaje("Noticias recolectadas: "+(d.cantidad??0));
   if(!d.noticias||d.noticias.length===0) setError("La búsqueda no produjo noticias extraíbles. No se utilizó IA.");
  } catch(e){setError(e.message);} finally{setCargando(false);}
 }
 async function cargarGuardadas(){
  setCargando(true);setError("");setMensaje("");
  try{const r=await fetch("/api/noticias");if(!r.ok)throw new Error("No se pudieron cargar las noticias.");const d=await r.json();setNoticias(d);setMensaje("Noticias almacenadas: "+d.length);}
  catch(e){setError(e.message);}finally{setCargando(false);}
 }
 return <main className="max-w-5xl mx-auto p-5 md:p-8">
  <header className="mb-8"><div className="text-3xl mb-2">🇵🇾</div><h1 className="text-3xl md:text-4xl font-bold text-red-400">Democracia Paraguaya</h1>
  <p className="text-slate-400 mt-2">Recolección de noticias públicas mediante DuckDuckGo y extracción HTML. Esta pantalla no utiliza IA.</p></header>
  <section className="bg-slate-900 border border-slate-800 rounded-xl p-5 mb-6">
   <form onSubmit={buscar} className="space-y-4">
    <label className="block text-sm text-slate-300">Persona, candidato o tema<input value={consulta} onChange={e=>setConsulta(e.target.value)} className="mt-1 w-full bg-slate-950 border border-slate-700 rounded-lg p-3" maxLength="200" required /></label>
    <label className="block text-sm text-slate-300">Cantidad máxima<select value={limite} onChange={e=>setLimite(e.target.value)} className="mt-1 block bg-slate-950 border border-slate-700 rounded-lg p-3">{[3,5,8,10].map(n=><option key={n} value={n}>{n}</option>)}</select></label>
    <div className="flex flex-wrap gap-3"><button disabled={cargando} className="bg-red-600 hover:bg-red-500 disabled:opacity-50 rounded-lg px-5 py-3 font-semibold">{cargando?"Buscando y extrayendo...":"Buscar noticias"}</button>
    <button type="button" onClick={cargarGuardadas} disabled={cargando} className="bg-slate-700 hover:bg-slate-600 disabled:opacity-50 rounded-lg px-5 py-3">Ver noticias guardadas</button></div>
   </form>
  </section>
  {mensaje&&<p className="text-emerald-300 mb-4">{mensaje}</p>}
  {error&&<div className="bg-amber-950/50 border border-amber-700 text-amber-200 p-4 rounded-lg mb-5">{error}</div>}
  {cargando&&<p className="text-slate-300">Consultando DuckDuckGo y descargando páginas...</p>}
  <section className="space-y-4">{noticias.map(n=><article key={n.id} className="bg-slate-900 border border-slate-800 rounded-xl p-5">
   <h2 className="text-xl font-semibold">{n.titulo||"Sin título"}</h2><p className="text-xs text-slate-500 mt-1">{n.medio||"Fuente desconocida"} · {n.fechaPublicacion||"Fecha no identificada"}</p>
   {n.resumen&&<p className="text-slate-300 mt-3">{n.resumen}</p>}{n.contenido&&<p className="text-slate-400 mt-3 text-sm">{n.contenido.slice(0,700)}{n.contenido.length>700?"…":""}</p>}
   {n.url&&<a href={n.url} target="_blank" rel="noopener noreferrer" className="inline-block text-sky-400 underline mt-4">Abrir publicación original</a>}
  </article>)}</section>
 </main>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
