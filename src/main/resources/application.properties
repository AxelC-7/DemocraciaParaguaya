spring.application.name=demopy
server.address=0.0.0.0
server.port=8080

# Cloudflare Tunnel
cloudflare.executable=${CLOUDFLARE_EXECUTABLE:cloudflared}
cloudflare.origin=${CLOUDFLARE_ORIGIN:http://127.0.0.1:8080}

# API keys and Telegram credentials are supplied through environment variables.
gemini.api.key=${GEMINI_API_KEY:}
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.chat-id=${TELEGRAM_CHAT_ID:}
