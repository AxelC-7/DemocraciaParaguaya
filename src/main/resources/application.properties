spring.application.name=demopy
server.address=0.0.0.0
server.port=8080

# Almacenamiento local JSON. En producción, configurar una ruta persistente.
demopy.storage.path=${DEMOPY_STORAGE_PATH:./data}

# Cloudflare Tunnel (disabled unless explicitly enabled)
cloudflare.enabled=${CLOUDFLARE_ENABLED:false}
cloudflare.executable=${CLOUDFLARE_EXECUTABLE:cloudflared}
cloudflare.origin=${CLOUDFLARE_ORIGIN:http://127.0.0.1:8080}

# Optional integrations
gemini.api.key=${GEMINI_API_KEY:}
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.chat-id=${TELEGRAM_CHAT_ID:}
